spring:
  application:
    name: devCollab

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  servlet:
    context-path: /api

app:
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 3600                             #1h
    refreshTokenExpiration: 604800                          #7d

  verification:
    emailVerificationTokenExpiration: 1800                  #30m
    otpVerificationTokenExpiration: 300                     #5m
    resetPasswordSessionVerificationTokenExpiration: 900    #15m

  websiteUrl: http://localhost:8080/api

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
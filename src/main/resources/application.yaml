spring:
  application:
    name: devCollab

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}

  jpa:
    properties:
      hibernate:
        default_schema: dev_collab
        ddl-auto: none

    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: dev_collab

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true

server:
  servlet:
    context-path: /api

app:
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 1200                             #20m
    refreshTokenExpiration: 604800                          #7d

  verification:
    emailVerificationTokenExpiration: 1800                  #30m
    otpVerificationTokenExpiration: 300                     #5m
    resetPasswordSessionVerificationTokenExpiration: 900    #15m

  websiteUrl: http://localhost:8080/api